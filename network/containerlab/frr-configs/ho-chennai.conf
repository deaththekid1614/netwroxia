!
hostname ho-chennai
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 ip address 10.0.1.1/30
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.1
 network 10.0.1.0/30 area 0
 network 10.255.0.1/32 area 0
!
router bgp 65001
 bgp router-id 10.255.0.1
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.3 remote-as 65001
 neighbor 10.255.0.3 update-source lo
 neighbor 10.255.0.4 remote-as 65001
 neighbor 10.255.0.4 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-reflector-client
  neighbor 10.255.0.3 route-reflector-client
  neighbor 10.255.0.4 route-reflector-client
 exit-address-family
!
line vty
!
