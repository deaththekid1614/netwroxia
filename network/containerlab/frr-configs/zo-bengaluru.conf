!
hostname zo-bengaluru
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 ip address 10.0.1.2/30
 ip ospf network point-to-point
!
interface eth2
 ip address 10.1.2.1/30
 ip ospf network point-to-point
!
interface eth3
 ip address 10.1.3.1/30
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.2
 network 10.0.1.0/30 area 0
 network 10.1.2.0/30 area 0
 network 10.1.3.0/30 area 0
 network 10.255.0.2/32 area 0
!
router bgp 65001
 bgp router-id 10.255.0.2
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 unicast
  network 10.1.2.0/30
  network 10.1.3.0/30
 exit-address-family
!
line vty
!
